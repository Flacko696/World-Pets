<header class="header">
  <div class="container header__inner">
    <a class="logo" href="{% url 'index' %}">Мир животных</a>
    <button class="burger" type="button" aria-expanded="false" aria-controls="menu">Меню ☰</button>

    <div class="header__menu" id="menu">
      <nav aria-label="Основное меню">
        <ul class="nav">
          {% for item in menu %}
          <li>
            <a href="{% url item.route %}"{% if request.resolver_match.url_name == item.route %} aria-current="page"{% endif %}>{{ item.title }}</a>
          </li>
          {% endfor %}
        </ul>
      </nav>

      <div class="header__actions">
        <span class="fav-badge" title="Избранные услуги">♥ <span id="fav-count">0</span></span>
        <a class="phone" href="tel:+78422000000">+7 (8422) 00-00-00</a>
        {% if user.is_authenticated %}
        <a class="link" href="{% url 'patients' %}">Кабинет врача</a>
        <a class="link" href="{% url 'reminders' %}">Напоминания</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="btn btn--outline" type="submit">Выйти</button>
        </form>
        {% else %}
        <a class="link" href="{% url 'login' %}">Войти</a>
        {% endif %}
        <a class="btn btn--primary" href="{% url 'appointment' %}">Записаться</a>
      </div>
    </div>
  </div>
</header>
